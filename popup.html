<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7fafc;
      color: #0f172a;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
    }
    .meta {
      margin-bottom: 10px;
      font-size: 12px;
      color: #475569;
      line-height: 1.5;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 220px;
      overflow: auto;
      border: 1px solid #dbe2ea;
      border-radius: 8px;
      background: #fff;
    }
    li {
      display: flex;
      justify-content: space-between;
      padding: 8px 10px;
      border-bottom: 1px solid #eef2f7;
      font-size: 13px;
    }
    li:last-child {
      border-bottom: 0;
    }
    .count {
      font-weight: 700;
      color: #0f766e;
    }
    .word {
      font-weight: 600;
    }
    .actions {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      cursor: pointer;
      background: #0f172a;
      color: #fff;
    }
    button.secondary {
      background: #e2e8f0;
      color: #0f172a;
    }
    .empty {
      margin: 0;
      padding: 14px 8px;
      text-align: center;
      color: #64748b;
      font-size: 12px;
      background: #fff;
      border: 1px solid #dbe2ea;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h3>High Frequency Review</h3>
  <div id="meta" class="meta">Loading...</div>
  <div id="diag" class="meta">Diagnosing page...</div>
  <div id="stats-list">Loading...</div>
  <div class="actions">
    <button id="open-vocab-manager">Open Vocabulary Manager</button>
    <button id="refresh-stats" class="secondary">Refresh</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
