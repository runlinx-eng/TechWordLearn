<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7fafc;
      color: #0f172a;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
    }
    .global-control {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      padding: 10px 12px;
      border: 1px solid #bbf7d0;
      border-radius: 10px;
      background: #f0fdf4;
    }
    .global-control[data-enabled="false"] {
      border-color: #cbd5e1;
      background: #f1f5f9;
    }
    .global-state-label {
      font-size: 13px;
      font-weight: 700;
      color: #166534;
    }
    .global-control[data-enabled="false"] .global-state-label {
      color: #475569;
    }
    .global-state-help {
      margin-top: 2px;
      font-size: 11px;
      line-height: 1.35;
      color: #64748b;
    }
    .switch {
      position: relative;
      display: inline-block;
      flex: 0 0 auto;
      width: 44px;
      height: 24px;
    }
    .switch input {
      width: 0;
      height: 0;
      opacity: 0;
    }
    .slider {
      position: absolute;
      inset: 0;
      cursor: pointer;
      border-radius: 999px;
      background: #94a3b8;
      transition: background 0.2s;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.3);
      transition: transform 0.2s;
    }
    .switch input:checked + .slider {
      background: #16a34a;
    }
    .switch input:checked + .slider::before {
      transform: translateX(20px);
    }
    .switch input:focus-visible + .slider {
      outline: 2px solid #2563eb;
      outline-offset: 2px;
    }
    .switch input:disabled + .slider {
      cursor: wait;
      opacity: 0.6;
    }
    .meta {
      margin-bottom: 10px;
      font-size: 12px;
      color: #475569;
      line-height: 1.5;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 220px;
      overflow: auto;
      border: 1px solid #dbe2ea;
      border-radius: 8px;
      background: #fff;
    }
    li {
      display: flex;
      justify-content: space-between;
      padding: 8px 10px;
      border-bottom: 1px solid #eef2f7;
      font-size: 13px;
    }
    li:last-child {
      border-bottom: 0;
    }
    .count {
      font-weight: 700;
      color: #0f766e;
    }
    .word {
      font-weight: 600;
    }
    .actions {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      cursor: pointer;
      background: #0f172a;
      color: #fff;
    }
    button.secondary {
      background: #e2e8f0;
      color: #0f172a;
    }
    .empty {
      margin: 0;
      padding: 14px 8px;
      text-align: center;
      color: #64748b;
      font-size: 12px;
      background: #fff;
      border: 1px solid #dbe2ea;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h3>当前最值得记的词</h3>
  <div id="global-control" class="global-control" data-enabled="true">
    <div>
      <div id="global-state-label" class="global-state-label">正在读取状态…</div>
      <div id="global-state-help" class="global-state-help">对所有支持的网页生效。</div>
    </div>
    <label class="switch" title="在所有支持的网页启用或停用 TechWordLearn">
      <input
        id="global-enabled"
        type="checkbox"
        role="switch"
        aria-labelledby="global-state-label"
        disabled
      />
      <span class="slider" aria-hidden="true"></span>
    </label>
  </div>
  <div id="meta" class="meta">正在读取…</div>
  <div id="diag" class="meta">正在检查当前网页…</div>
  <div id="stats-list">正在读取…</div>
  <div class="actions">
    <button id="open-vocab-manager">打开我的词库</button>
    <button id="refresh-stats" class="secondary">刷新</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
